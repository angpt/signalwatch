# Smallest possible setup: SerpAPI plus the built-in keyword heuristic, no LLM.
#   export SERPAPI_API_KEY=...
#   python3 -m signalwatch run --config config/heuristic.toml

[storage]
database_path = "work/state/mentions.db"
latest_digest_path = "outputs/latest_digest.txt"
history_dir = "outputs/digests"

[summarizer]
provider = "heuristic"

[providers.serpapi]
api_key_env = "SERPAPI_API_KEY"

[providers.sources]
google_news = true
google_search = true
selected_web = false

[[keywords]]
name = "example"
query = "\"example product\""
